[project]
name = "odonto-backend"
version = "0.1.0"
description = "API do Odonto System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "tzdata>=2024.1",  # base de fusos para zoneinfo (o Windows não traz)
    "python-multipart>=0.0.12",  # upload de arquivos
    "openpyxl>=3.1",  # leitura e geração de .xlsx
    "defusedxml>=0.7",  # o openpyxl usa automaticamente: protege contra XML malicioso
    "pydicom>=3.0",  # metadados dos arquivos de raio-X (DICOM)
]

[project.optional-dependencies]
# Armazenamento em nuvem (STORAGE_BACKEND=s3). Não é preciso no desenvolvimento.
s3 = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requer PostgreSQL (TEST_DATABASE_URL e TEST_MIGRATIONS_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # Depends() em argumentos é o padrão do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # a pasta local alembic/ confunde a detecção
