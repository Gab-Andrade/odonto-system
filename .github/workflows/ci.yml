name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: odonto_test
          POSTGRES_USER: odonto
          POSTGRES_PASSWORD: odonto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odonto -d odonto_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://odonto_app:odonto_app@localhost:5432/odonto_test
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://odonto:odonto@localhost:5432/odonto_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Criar role da aplicação no Postgres
        env:
          PGPASSWORD: odonto
        run: >-
          psql -h localhost -U odonto -d odonto_test -v ON_ERROR_STOP=1
          -v app_password=odonto_app -v owner=odonto
          -f ../docker/postgres/roles.sql

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Testes (unitários + integração)
        shell: bash
        run: |
          set +e
          pytest -q -rfE --tb=line 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Anotações são públicas na API do GitHub (o log completo exige login).
            # O GitHub limita a 10 anotações por etapa, então vão todas numa só.
            msg=$(grep -E '^(FAILED|ERROR) |^E |^/.*\.py:[0-9]+:|Error' pytest.out \
              | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falhas do pytest::${msg}"
          fi
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Cliente da API em dia com o openapi.json
        run: |
          npm run gerar-api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Build (tipos + Vite + PWA)
        run: npm run build

  openapi:
    # O openapi.json do front precisa refletir a API: se mudou uma rota, rode
    # `npm run atualizar-api` no frontend e commite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - name: openapi.json em dia
        run: |
          python -m app.cli openapi --saida ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json
