name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: odonto_test
          POSTGRES_USER: odonto
          POSTGRES_PASSWORD: odonto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odonto -d odonto_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://odonto_app:odonto_app@localhost:5432/odonto_test
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://odonto:odonto@localhost:5432/odonto_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Criar role da aplicação no Postgres
        env:
          PGPASSWORD: odonto
        run: >-
          psql -h localhost -U odonto -d odonto_test -v ON_ERROR_STOP=1
          -v app_password=odonto_app -v owner=odonto
          -f ../docker/postgres/roles.sql

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Testes (unitários + integração)
        run: pytest -q
